# Sets the bundled Supabase project up from a GitHub runner, so the owner needs no CLI on the Mac:
#   1. applies supabase/schema.sql (idempotent) through the Management API
#   2. deploys the five Edge Functions with the Supabase CLI
#   3. optionally turns "Confirm email" off and allows the app's OAuth return URL
#   4. probes the project again and prints what still needs a human (secrets for AI / Paddle / cron)
#
# Needs ONE repository secret: SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens → Generate).
# The project ref comes from engine/cloud.json. Nothing here stores or prints the token. Function secrets
# (ANTHROPIC_API_KEY, PADDLE_*, MONITOR_CRON_SECRET) are never touched — set them in the dashboard.
name: cloud-deploy
on:
  workflow_dispatch:
    inputs:
      apply_schema:
        description: "Apply supabase/schema.sql (safe to re-run)"
        type: boolean
        default: true
      deploy_functions:
        description: "Deploy the Edge Functions (account, ai-fix, billing, monitor, admin)"
        type: boolean
        default: true
      disable_email_confirmation:
        description: "Turn 'Confirm email' OFF — the built-in mailer only reaches the project's team, so without SMTP nobody else can sign in"
        type: boolean
        default: false
      allow_app_redirect:
        description: "Allow beforeideploy://auth-callback as an auth redirect (OAuth sign-in returns to the app)"
        type: boolean
        default: true
      setup_monitor_cron:
        description: "Server-side monitoring: generate MONITOR_CRON_SECRET, schedule the monitor every 5 min (pg_cron + Vault) and run it once"
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the token and read the project ref
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is missing. Supabase → Account → Access Tokens → Generate new token, then GitHub → Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          URL=$(node -p "require('./engine/cloud.json').url")
          REF=$(node -p "(/^https:\/\/([a-z0-9-]+)\.supabase\.co/.exec(require('./engine/cloud.json').url)||[])[1]||''")
          [ -n "$REF" ] || { echo "::error::engine/cloud.json has no hosted Supabase URL"; exit 1; }
          echo "PROJECT_URL=$URL" >> "$GITHUB_ENV"
          echo "PROJECT_REF=$REF" >> "$GITHUB_ENV"
          echo "project: $URL (ref $REF)"
          # the token must belong to an account that owns this project
          code=$(curl -sS -m 30 -o /tmp/proj.json -w "%{http_code}" "https://api.supabase.com/v1/projects/$REF" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          if [ "$code" != "200" ]; then echo "::error::Management API answered $code for project $REF — is the token from the account that owns it?"; head -c 300 /tmp/proj.json; exit 1; fi
          node -p "const p=require('/tmp/proj.json'); 'name: '+p.name+' · region: '+p.region+' · status: '+p.status"

      - name: Apply supabase/schema.sql
        if: ${{ inputs.apply_schema }}
        run: |
          node -e '
            const fs = require("fs");
            fs.writeFileSync("/tmp/query.json", JSON.stringify({ query: fs.readFileSync("supabase/schema.sql", "utf8") }));'
          code=$(curl -sS -m 120 -o /tmp/schema.out -w "%{http_code}" -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/query.json)
          echo "schema.sql → HTTP $code"
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then head -c 1500 /tmp/schema.out; echo; echo "::error::schema.sql failed"; exit 1; fi
          echo "schema applied"

      - uses: supabase/setup-cli@v1
        if: ${{ inputs.deploy_functions }}
        with:
          version: latest

      - name: Deploy the Edge Functions
        if: ${{ inputs.deploy_functions }}
        run: |
          supabase functions deploy admin ai-fix account --project-ref "$PROJECT_REF"
          supabase functions deploy billing --no-verify-jwt --project-ref "$PROJECT_REF"
          supabase functions deploy monitor --no-verify-jwt --project-ref "$PROJECT_REF"

      - name: Auth options (e-mail confirmation, app redirect)
        if: ${{ inputs.disable_email_confirmation || inputs.allow_app_redirect }}
        run: |
          curl -sS -m 30 -o /tmp/auth.json "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"
          node -e '
            const cur = require("/tmp/auth.json");
            const patch = {};
            if (process.env.DISABLE_CONFIRM === "true") patch.mailer_autoconfirm = true;
            if (process.env.ALLOW_REDIRECT === "true") {
              const list = String(cur.uri_allow_list || "").split(",").map((s) => s.trim()).filter(Boolean);
              if (!list.includes("beforeideploy://auth-callback")) list.push("beforeideploy://auth-callback");
              patch.uri_allow_list = list.join(",");
            }
            require("fs").writeFileSync("/tmp/patch.json", JSON.stringify(patch));
            console.log("patch:", JSON.stringify(patch));' 
          code=$(curl -sS -m 30 -o /tmp/auth2.json -w "%{http_code}" -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/patch.json)
          echo "auth config → HTTP $code"
          [ "$code" = "200" ] || { head -c 500 /tmp/auth2.json; echo; echo "::error::auth config update failed"; exit 1; }
        env:
          DISABLE_CONFIRM: ${{ inputs.disable_email_confirmation }}
          ALLOW_REDIRECT: ${{ inputs.allow_app_redirect }}

      - name: Server-side monitoring scheduler
        if: ${{ inputs.setup_monitor_cron }}
        run: |
          # a fresh random secret, created here and handed straight to Supabase: no person ever sees it
          export SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$SECRET"
          node -e 'require("fs").writeFileSync("/tmp/secrets.json", JSON.stringify([{ name: "MONITOR_CRON_SECRET", value: process.env.SECRET }]))'
          code=$(curl -sS -m 30 -o /tmp/sec.out -w "%{http_code}" -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/secrets" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/secrets.json)
          rm -f /tmp/secrets.json
          echo "function secret MONITOR_CRON_SECRET → HTTP $code"
          case "$code" in 200|201) ;; *) head -c 300 /tmp/sec.out; echo; echo "::error::could not set MONITOR_CRON_SECRET"; exit 1 ;; esac

          # the same values into Vault and the pg_cron job (supabase/monitor-cron.sql, made idempotent)
          node -e '
            const url = process.env.PROJECT_URL + "/functions/v1/monitor";
            const sql = `
          create extension if not exists pg_cron;
          create extension if not exists pg_net;
          do $do$
          declare i uuid;
          begin
            select id into i from vault.secrets where name = $n$bid_monitor_url$n$;
            if i is null then perform vault.create_secret($v$${url}$v$, $n$bid_monitor_url$n$);
            else perform vault.update_secret(i, $v$${url}$v$); end if;
            select id into i from vault.secrets where name = $n$bid_monitor_secret$n$;
            if i is null then perform vault.create_secret($v$${process.env.SECRET}$v$, $n$bid_monitor_secret$n$);
            else perform vault.update_secret(i, $v$${process.env.SECRET}$v$); end if;
          end
          $do$;
          select cron.unschedule($n$bid-monitor$n$) where exists (select 1 from cron.job where jobname = $n$bid-monitor$n$);
          select cron.schedule($n$bid-monitor$n$, $n$*/5 * * * *$n$, $job$
            select net.http_post(
              url := (select decrypted_secret from vault.decrypted_secrets where name = $q$bid_monitor_url$q$),
              headers := jsonb_build_object($q$content-type$q$, $q$application/json$q$,
                $q$x-monitor-secret$q$, (select decrypted_secret from vault.decrypted_secrets where name = $q$bid_monitor_secret$q$)),
              body := jsonb_build_object($q$action$q$, $q$run$q$),
              timeout_milliseconds := 55000);
          $job$);`;
            require("fs").writeFileSync("/tmp/cron.json", JSON.stringify({ query: sql }));'
          code=$(curl -sS -m 60 -o /tmp/cron.out -w "%{http_code}" -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/cron.json)
          rm -f /tmp/cron.json
          echo "pg_cron job bid-monitor → HTTP $code"
          case "$code" in 200|201) ;; *) head -c 800 /tmp/cron.out; echo; echo "::error::scheduling failed"; exit 1 ;; esac

          # one run now, the way the scheduler calls it (the new secret can take a few seconds to reach the function)
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -m 60 -o /tmp/run.out -w "%{http_code}" -X POST "$PROJECT_URL/functions/v1/monitor" \
              -H "Content-Type: application/json" -H "x-monitor-secret: $SECRET" -d '{"action":"run"}' || true)
            echo "monitor run (try $i) → HTTP $code"
            [ "$code" = "200" ] && break
            sleep 10
          done
          head -c 300 /tmp/run.out; echo
          [ "$code" = "200" ] || { echo "::error::the monitor function did not accept the scheduler call"; exit 1; }
          echo "server-side monitoring is scheduled every 5 minutes and answered a first run"

      - name: Probe the project again
        run: |
          K=$(node -p "require('./engine/cloud.json').anonKey")
          probe() { printf '%-40s ' "$1"; curl -sS -m 20 -o /tmp/body -w "%{http_code}" "${@:2}" || true; echo; }
          probe "GET /auth/v1/settings" "$PROJECT_URL/auth/v1/settings" -H "apikey: $K"
          node -p "const j=require('/tmp/body'); 'signup: '+(!j.disable_signup)+' · confirm e-mail: '+(!j.mailer_autoconfirm)+' · providers: '+Object.keys(j.external||{}).filter(k=>j.external[k]).join(',')" 2>/dev/null || true
          for t in profiles settings subscriptions credit_ledger ai_usage monitor_targets; do probe "GET /rest/v1/$t" "$PROJECT_URL/rest/v1/$t?select=*&limit=0" -H "apikey: $K"; done
          for f in account billing monitor ai-fix admin; do probe "POST /functions/v1/$f" -X POST "$PROJECT_URL/functions/v1/$f" -H "apikey: $K" -H "Authorization: Bearer $K" -H "Content-Type: application/json" -d '{}'; done
          echo
          echo "Still yours to do in the dashboard (secrets are never set from CI):"
          echo "  supabase secrets: ANTHROPIC_API_KEY (+ ANTHROPIC_API_BASE for a proxy) for ai-fix; PADDLE_API_KEY + PADDLE_WEBHOOK_SECRET + PADDLE_ENV=sandbox for billing"
          echo "  monitoring scheduler: run this workflow with setup_monitor_cron (no manual SQL needed)"
