name: site
# The public website: pages are generated from scripts/site-build.py and the plans catalog,
# so the committed pages must match what the generator produces.
on:
  push:
    paths: ['site/**', 'scripts/site-build.py', 'supabase/functions/_shared/plans-catalog.json', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', 'scripts/site-build.py', 'supabase/functions/_shared/plans-catalog.json', '.github/workflows/site.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate the pages
        run: python3 scripts/site-build.py
      - name: Committed pages match the generator
        run: git diff --exit-code -- site/
