# Probes the cloud project the app is bundled with (engine/cloud.json) from a GitHub runner: is the project
# alive, can people sign up, must they confirm e-mail, are the Edge Functions deployed. Nothing secret is used
# (the anon key is public by design) and nothing is written. Run it by hand from the Actions tab.
name: cloud-check
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe the bundled cloud project
        run: |
          U=$(node -p "require('./engine/cloud.json').url")
          K=$(node -p "require('./engine/cloud.json').anonKey")
          echo "project: $U"
          probe() { printf '%-42s ' "$1"; curl -sS -m 20 -o /tmp/body -w "%{http_code}" "${@:2}" || true; echo; }
          probe "GET /auth/v1/health" "$U/auth/v1/health" -H "apikey: $K"
          probe "GET /auth/v1/settings" "$U/auth/v1/settings" -H "apikey: $K"
          echo "--- auth settings (public):"; node -e '
            const j = JSON.parse(require("fs").readFileSync("/tmp/body","utf8") || "{}");
            console.log(JSON.stringify({ external: j.external, disable_signup: j.disable_signup, mailer_autoconfirm: j.mailer_autoconfirm, phone_autoconfirm: j.phone_autoconfirm }, null, 1));' || cat /tmp/body
          probe "GET /rest/v1/settings (anon)" "$U/rest/v1/settings?select=key&limit=1" -H "apikey: $K"
          probe "GET /rest/v1/profiles (anon)" "$U/rest/v1/profiles?select=user_id&limit=1" -H "apikey: $K"
          probe "GET /rest/v1/monitor_targets (anon)" "$U/rest/v1/monitor_targets?select=id&limit=1" -H "apikey: $K"
          for f in account billing monitor ai-fix admin; do
            probe "POST /functions/v1/$f (anon, {})" -X POST "$U/functions/v1/$f" -H "apikey: $K" -H "Authorization: Bearer $K" -H "Content-Type: application/json" -d '{}'
            head -c 300 /tmp/body; echo
          done
          probe "POST /auth/v1/token (wrong password)" -X POST "$U/auth/v1/token?grant_type=password" -H "apikey: $K" -H "Content-Type: application/json" -d '{"email":"nobody@example.invalid","password":"definitely-wrong-123"}'
          head -c 300 /tmp/body; echo
